name: CI

# Every push to main, every pull request, or by hand from the Actions tab.
# Unit tests, then the CDE jobs and the semantic SQL on local Spark + Iceberg for
# all five business dates, the KPI consistency check, then the failed-batch drill (a run dies mid-write, the partial batch is
# inspected, and --resume finishes it). Nothing here talks to Cloudera.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests + the pipeline on local Spark + Iceberg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java (local Spark / Iceberg needs it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Unit tests
        run: pytest -q

      # The generator is deterministic, so every run sees the same data and faults.
      - name: Pipeline, all business dates
        run: python scripts/run_local.py all

      # Every MIS view, regulatory dataset and ad-hoc query must give the certified KPI figure.
      - name: KPI consistency, ad-hoc and time-travel SQL
        run: |
          python scripts/run_semantic.py --steps check --fail-on-mismatch
          python scripts/run_local.py adhoc time-travel

      - name: Failed batch drill
        run: |
          python scripts/run_local.py land bronze --dates 2026-09-21,2026-09-22 --landing /tmp/drill/landing --warehouse /tmp/drill/warehouse
          python scripts/run_local.py land --dates 2026-09-23 --landing /tmp/drill/landing
          D3="--dates 2026-09-23 --landing /tmp/drill/landing --warehouse /tmp/drill/warehouse"
          ! python scripts/run_local.py bronze $D3 -- --fail-during lms_loan
          ! python scripts/run_local.py recon $D3 -- --fail-on-mismatch        # the failed batch is reported
          ! python scripts/run_local.py silver $D3                             # and silver refuses to build on it
          python scripts/run_local.py bronze $D3 -- --resume
          python scripts/run_local.py silver recon $D3
